name = "prestige-market-api"
main = "cloudflare/worker.js"
compatibility_date = "2026-10-01"

[vars]
APP_NAME = "Prestige Market"
# Set WEBAPP_URL, BOT_USERNAME, ADMIN_IDS, etc. as Worker secrets/vars.

[[d1_databases]]
binding = "DB"
database_name = "prestige-market-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Optional media bucket. Create it with:
# npx wrangler r2 bucket create prestige-market-media
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "prestige-market-media"
