
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#101010">
<title>Prestige Market</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#f5f3ef;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer}
.app{max-width:600px;margin:auto;padding:22px 17px 100px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.logo{font-size:22px;font-weight:800;letter-spacing:1.5px}
.logo span{color:#c8b58c}
.profile{background:#222;border:1px solid #333;color:#eee;border-radius:50%;width:42px;height:42px;font-size:19px}
.hero{padding:25px 22px;border:1px solid #3a3428;border-radius:22px;background:linear-gradient(135deg,#29251e,#171614 65%,#111);margin-bottom:27px}
.eyebrow{font-size:10px;letter-spacing:2px;color:#c8b58c;font-weight:700}
.hero h1{font-size:27px;line-height:1.2;margin:13px 0 9px}
.hero p{font-size:13px;color:#aaa;line-height:1.5;margin:0}
.section-title{font-size:19px;font-weight:750;margin:27px 0 15px}
.categories{display:flex;gap:9px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.categories::-webkit-scrollbar{display:none}
.cat{white-space:nowrap;border:1px solid #333;background:#1a1a1a;color:#aaa;border-radius:30px;padding:11px 15px;font-size:12px}
.cat.active{background:#c8b58c;color:#15130f;border-color:#c8b58c;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#191919;border:1px solid #292929;border-radius:17px;overflow:hidden;min-width:0}
.cover{height:130px;background:linear-gradient(145deg,#302b22,#171717);display:grid;place-items:center;font-size:42px}
.info{padding:13px}
.name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desc{font-size:11px;color:#888;margin-top:6px;min-height:28px;line-height:1.4}
.price{font-size:15px;font-weight:750;margin-top:12px;color:#d6c49a}
.buy{width:100%;border:0;border-radius:10px;background:#c8b58c;color:#17140e;padding:10px;margin-top:11px;font-size:12px;font-weight:800}
.empty{grid-column:1/-1;text-align:center;padding:35px 15px;color:#888;background:#191919;border:1px solid #292929;border-radius:16px;font-size:13px;line-height:1.6}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#141414ee;border-top:1px solid #292929;padding:12px 15px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.bottom-inner{width:100%;max-width:560px;display:flex;justify-content:space-around}
.nav{background:none;border:0;color:#888;font-size:11px;display:grid;gap:5px;justify-items:center}
.nav b{font-size:20px;font-weight:400}
.nav.active{color:#d6c49a}
.notice{position:fixed;left:20px;right:20px;bottom:85px;background:#29251e;border:1px solid #5c5039;border-radius:12px;padding:14px;text-align:center;font-size:13px;display:none;z-index:5}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">PRESTIGE <span>MARKET</span></div>
    <button class="profile" onclick="showNotice('Личный кабинет скоро появится')">♙</button>
  </header>

  <section class="hero">
    <div class="eyebrow">EXCLUSIVE DIGITAL MARKETPLACE</div>
    <h1>Цифровая роскошь.<br>В одном месте.</h1>
    <p>NFT-подарки, коллекционные юзернеймы, Stars и Premium.</p>
  </section>

  <div class="section-title">Каталог</div>
  <div class="categories" id="categories">
    <button class="cat active" data-id="all">Все</button>
    <button class="cat" data-id="gifts">🎁 NFT Gifts</button>
    <button class="cat" data-id="usernames">👤 Usernames</button>
    <button class="cat" data-id="numbers">📱 Numbers</button>
    <button class="cat" data-id="stars">⭐ Stars</button>
    <button class="cat" data-id="premium">💎 Premium</button>
  </div>

  <div class="section-title" id="catalogTitle">Популярное</div>
  <div class="grid" id="listings">
    <div class="empty">Загружаем каталог…</div>
  </div>
</div>

<div class="notice" id="notice"></div>

<nav class="bottom">
  <div class="bottom-inner">
    <button class="nav active" onclick="goHome(this)"><b>⌂</b>Главная</button>
    <button class="nav" onclick="showNotice('Избранное подключим следующим этапом')"><b>♡</b>Избранное</button>
    <button class="nav" onclick="showNotice('Ваши заказы появятся здесь')"><b>▤</b>Заказы</button>
    <button class="nav" onclick="showNotice('Профиль скоро появится')"><b>♙</b>Профиль</button>
  </div>
</nav>

<script>
const API = "https://prestige-markett.rtmzakarin.workers.dev";
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor("#101010");
  tg.setBackgroundColor("#101010");
}

let selectedCategory = "all";
let allListings = [];

const icons = {
  gifts:"🎁",
  usernames:"👤",
  numbers:"📱",
  stars:"⭐",
  premium:"💎"
};

function showNotice(message) {
  const el = document.getElementById("notice");
  el.textContent = message;
  el.style.display = "block";
  clearTimeout(window.noticeTimer);
  window.noticeTimer = setTimeout(() => el.style.display = "none", 2600);
}

function money(price, currency) {
  return `${Number(price || 0).toLocaleString("ru-RU")} ${currency || "USD"}`;
}

function renderListings() {
  const container = document.getElementById("listings");
  const items = selectedCategory === "all"
    ? allListings
    : allListings.filter(x => x.category_id === selectedCategory);

  document.getElementById("catalogTitle").textContent =
    selectedCategory === "all" ? "Популярное" : "Каталог";

  if (!items.length) {
    container.innerHTML = `<div class="empty">Пока здесь нет товаров.<br>Новые предложения скоро появятся.</div>`;
    return;
  }

  container.innerHTML = items.map(item => `
    <article class="card">
      <div class="cover">
        ${item.image_url
          ? `<img src="${escapeAttr(item.image_url)}" style="width:100%;height:100%;object-fit:cover" onerror="this.remove()">`
          : (icons[item.category_id] || "✦")}
      </div>
      <div class="info">
        <div class="name">${escapeHtml(item.title)}</div>
        <div class="desc">${escapeHtml(item.description || "Эксклюзивное предложение")}</div>
        <div class="price">${money(item.price, item.currency)}</div>
        <button class="buy" onclick="createOrder(${Number(item.id)})">Подробнее / Заказать</button>
      </div>
    </article>
  `).join("");
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function escapeAttr(value) {
  return escapeHtml(value);
}

async function loadListings() {
  const container = document.getElementById("listings");
  try {
    const response = await fetch(API + "/api/listings");
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error("Не удалось загрузить каталог");
    allListings = data.listings || [];
    renderListings();
  } catch (error) {
    container.innerHTML = `<div class="empty">Не удалось загрузить каталог.<br>Попробуйте обновить страницу.</div>`;
  }
}

async function createOrder(id) {
  if (!tg?.initData) {
    showNotice("Оформление заказа доступно внутри Telegram");
    return;
  }

  try {
    const response = await fetch(API + "/api/orders", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "X-Telegram-Init-Data":tg.initData
      },
      body:JSON.stringify({listing_id:id})
    });
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.error || "Ошибка заказа");
    showNotice("Заявка №" + data.public_id + " создана!");
    tg.HapticFeedback?.notificationOccurred("success");
  } catch (error) {
    showNotice(error.message || "Не удалось оформить заказ");
  }
}

document.getElementById("categories").addEventListener("click", event => {
  const button = event.target.closest(".cat");
  if (!button) return;
  document.querySelectorAll(".cat").forEach(x => x.classList.remove("active"));
  button.classList.add("active");
  selectedCategory = button.dataset.id;
  renderListings();
});

function goHome(button) {
  document.querySelectorAll(".nav").forEach(x => x.classList.remove("active"));
  button.classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
}

loadListings();
</script>
</body>
</html>
